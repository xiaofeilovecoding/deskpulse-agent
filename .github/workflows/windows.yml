name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Check publication paths
        shell: pwsh
        run: |
          $internal = @(git ls-files -- AGENTS.md docs/PRD.md docs/design docs/development-prompt.md docs/internal)
          if ($internal.Count -ne 0) { throw 'Internal material is tracked in the publication tree.' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-H=windowsgui" -o dist/deskpulse-agent.exe ./cmd/deskpulse-agent
      - name: Run the native renderer from the built executable
        shell: pwsh
        run: ./scripts/test-windows-render.ps1 -Executable dist/deskpulse-agent.exe -ScratchDirectory $env:RUNNER_TEMP
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the per-user installer
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'deskpulse-wix'
          dotnet tool install wix --version 5.0.2 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (Resolve-Path dist/deskpulse-agent.exe).Path
          & (Join-Path $tools 'wix.exe') build -arch x64 -d "AgentExecutable=$source" -d ProductVersion=0.1.0 packaging/windows/DeskPulse.wxs -out dist/deskpulse-agent-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: deskpulse-agent-windows-x64
          path: |
            dist/deskpulse-agent.exe
            dist/deskpulse-agent-x64.msi
          if-no-files-found: error

  windows-11-emulation:
    name: Windows 11 x64 executable under Arm emulation
    needs: windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskpulse-agent-windows-x64
          path: dist
      - name: Verify the Windows 11 client and run the x64 binary
        shell: pwsh
        env:
          HOST_ARCH: ${{ runner.arch }}
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000 -or $env:HOST_ARCH -ne 'ARM64') {
            throw 'Expected a Windows 11 Arm client.'
          }
          Write-Host "$($os.Caption), build $($os.BuildNumber), $env:HOST_ARCH"
          $hash = (Get-FileHash -LiteralPath dist/deskpulse-agent.exe -Algorithm SHA256).Hash
          Write-Host "x64 executable SHA256 $hash"
          ./scripts/test-windows-render.ps1 -Executable dist/deskpulse-agent.exe -ScratchDirectory $env:RUNNER_TEMP

  windows-11-x64-vm:
    name: Windows 11 x64 evaluation VM and RDP reconnect
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/validation/')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deskpulse-agent-windows-x64
          path: dist
      - name: Run the x64 Windows VM
        shell: bash
        run: bash scripts/windows11-vm/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deskpulse-windows-11-x64-vm-evidence
          path: ${{ runner.temp }}/deskpulse-win11/shared/*.json
          if-no-files-found: ignore
