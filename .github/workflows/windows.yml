name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Check publication paths
        shell: pwsh
        run: |
          $internal = @(git ls-files -- AGENTS.md docs/PRD.md docs/design docs/development-prompt.md docs/internal)
          if ($internal.Count -ne 0) { throw 'Internal material is tracked in the publication tree.' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-H=windowsgui" -o dist/deskpulse-agent.exe ./cmd/deskpulse-agent
      - name: Run the native renderer from the built executable
        shell: pwsh
        run: |
          $capture = Join-Path $env:RUNNER_TEMP 'deskpulse-capture'
          $data = Join-Path $env:RUNNER_TEMP 'deskpulse-capture-data'
          $info = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path dist/deskpulse-agent.exe).Path)
          $info.UseShellExecute = $false
          foreach ($arg in @('--synthetic', '--data-dir', $data, '--capture-dir', $capture)) { $info.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($info)
          try {
            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw 'Native renderer timed out.'
            }
            if ($process.ExitCode -ne 0) { throw 'Native renderer failed.' }
          } finally {
            $process.Dispose()
          }
          foreach ($scale in @('100%', '125%', '150%', '200%')) {
            foreach ($frame in @('ball.png', 'hover.png', 'settings-deepseek.png', 'analysis-details.png')) {
              $path = Join-Path $capture "$scale/$frame"
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing capture $path" }
            }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the per-user installer
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'deskpulse-wix'
          dotnet tool install wix --version 5.0.2 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (Resolve-Path dist/deskpulse-agent.exe).Path
          & (Join-Path $tools 'wix.exe') build -arch x64 -d "AgentExecutable=$source" -d ProductVersion=0.1.0 packaging/windows/DeskPulse.wxs -out dist/deskpulse-agent-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: deskpulse-agent-windows-x64
          path: |
            dist/deskpulse-agent.exe
            dist/deskpulse-agent-x64.msi
          if-no-files-found: error
