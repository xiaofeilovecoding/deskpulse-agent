name: Windows x64 VM capability

on:
  push:
    branches: ['validation/**']

permissions:
  contents: read

jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check hardware acceleration and runner disk budget
        shell: bash
        run: |
          uname -m
          df -h "$RUNNER_TEMP"
          if ! test -c /dev/kvm; then
            echo 'The standard Linux runner has no KVM device.'
            exit 1
          fi
          sudo python3 - <<'PY'
          import fcntl
          import os
          with open('/dev/kvm', 'rb+') as device:
              assert fcntl.ioctl(device.fileno(), 0xae00) == 12
              vm_fd = fcntl.ioctl(device.fileno(), 0xae01, 0)
              os.close(vm_fd)
          print('Created an empty hardware-accelerated x64 VM through KVM.')
          PY
