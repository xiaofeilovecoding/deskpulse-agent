name: macOS build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app bundle
        run: bash macos/build.sh
      - name: Check both architectures and run a system probe
        shell: bash
        run: |
          app="dist/DeskPulse Agent.app"
          executable="$app/Contents/MacOS/deskpulse-agent"
          plutil -lint "$app/Contents/Info.plist"
          lipo -verify_arch arm64 x86_64 "$executable"
          "$executable" --sample | python3 -c 'import json,sys; s=json.load(sys.stdin); assert 0 <= s["cpu_used_ratio"] <= 1 and 0 <= s["estimated_available_memory_bytes"] <= s["physical_memory_bytes"]'
