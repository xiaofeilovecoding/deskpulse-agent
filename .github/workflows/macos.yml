name: macOS build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app bundle
        run: bash macos/build.sh
      - name: Check both architectures and run a system probe
        shell: bash
        run: |
          app="dist/DeskPulse Agent.app"
          executable="$app/Contents/MacOS/deskpulse-agent"
          plutil -lint "$app/Contents/Info.plist"
          lipo "$executable" -verify_arch arm64 x86_64
          "$executable" --sample | python3 -c 'import json,sys; s=json.load(sys.stdin); assert 0 <= s["cpu_used_ratio"] <= 1 and 0 <= s["estimated_available_memory_bytes"] <= s["physical_memory_bytes"]'
      - name: Package the preview
        run: ditto -c -k --keepParent "dist/DeskPulse Agent.app" dist/deskpulse-agent-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deskpulse-agent-macos-universal
          path: dist/deskpulse-agent-macos-universal.zip
          if-no-files-found: error
