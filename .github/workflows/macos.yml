name: macOS build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal app bundle
        run: bash macos/build.sh
      - name: Check both architectures and run a system probe
        shell: bash
        run: |
          app="dist/DeskPulse Agent.app"
          executable="$app/Contents/MacOS/deskpulse-agent"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          lipo "$executable" -verify_arch arm64 x86_64
          helper="$app/Contents/Helpers/deskpulse-model"
          lipo "$helper" -verify_arch arm64 x86_64
          printf '{}' | "$helper" | python3 -c 'import json,sys; assert "error" in json.load(sys.stdin)'
          "$executable" --sample | python3 -c 'import json,sys; s=json.load(sys.stdin); assert 0 <= s["cpu_used_ratio"] <= 1 and 0 <= s["estimated_available_memory_bytes"] <= s["physical_memory_bytes"]'
          "$executable" --check-process-sampler
          "$executable" --check-latency
          "$executable" --check-export | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["schema_version"] == 1 and len(s["metrics"]) == 5 and s["metrics"][0]["value"] == 0.3'
      - name: Verify synthetic credentials in an isolated Keychain
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/deskpulse-test.keychain-db"
          prior=$(security default-keychain -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          password=$(openssl rand -hex 20)
          cleanup() {
            if [[ -n "$prior" ]]; then security default-keychain -d user -s "$prior"; fi
            security delete-keychain "$keychain"
          }
          security create-keychain -p "$password" "$keychain"
          trap cleanup EXIT
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          "dist/DeskPulse Agent.app/Contents/MacOS/deskpulse-agent" --check-model-keychain
      - name: Exercise the native menu bar in both languages and themes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"]) / "deskpulse-macos-ui"
          executable = Path("dist/DeskPulse Agent.app/Contents/MacOS/deskpulse-agent")
          for language in ("en", "zh-CN"):
              output = root / language
              subprocess.run([executable, "--check-ui", output, language], check=True, timeout=45)
              light, dark = ((output / f"{theme}.png").read_bytes() for theme in ("light", "dark"))
              assert light != dark
              for file in (light, dark):
                  assert file[:8] == b"\x89PNG\r\n\x1a\n"
                  width, height = struct.unpack(">II", file[16:24])
                  assert width >= 300 and height >= 290
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deskpulse-macos-ui-${{ matrix.runner }}
          path: ${{ runner.temp }}/deskpulse-macos-ui
          if-no-files-found: error
      - name: Package the preview
        if: matrix.runner == 'macos-15'
        run: ditto -c -k --keepParent "dist/DeskPulse Agent.app" dist/deskpulse-agent-macos-universal.zip
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with:
          name: deskpulse-agent-macos-universal
          path: dist/deskpulse-agent-macos-universal.zip
          if-no-files-found: error
